<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Customer</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

    <div class="form-container">

        <h1>➕ Add Customer</h1>


        <form method="POST">

            <!-- Customer Name -->

            <label for="name">
                Customer Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter customer name"
                required
            >


            <!-- Customer Details -->

            <label for="details">
                Customer Details
            </label>

            <textarea
                id="details"
                name="details"
                placeholder="Enter address or other details"
            ></textarea>


            <!-- Default Quantity -->

            <label for="default_qty">
                Default Daily Quantity (Liters)
            </label>

            <input
                type="number"
                id="default_qty"
                name="default_qty"
                step="0.5"
                min="0"
                placeholder="Example: 1"
                required
            >


            <!-- Rate -->

            <label for="rate">
                Rate per Liter (₹)
            </label>

            <input
                type="number"
                id="rate"
                name="rate"
                step="0.01"
                min="0"
                placeholder="Example: 60"
                required
            >


            <!-- Start Date -->

            <label for="start_date">
                Start Date
            </label>

            <input
                type="date"
                id="start_date"
                name="start_date"
                required
            >


            <!-- Save -->

            <button
                type="submit"
                class="btn"
            >
                Save Customer
            </button>

        </form>


        <br>


        <a
            href="{{ url_for('home') }}"
            class="back-link"
        >
            ← Back to Home
        </a>


        <br><br>


        <a
            href="{{ url_for('customers') }}"
            class="back-link"
        >
            👥 View Customers
        </a>

    </div>

</body>

</html>
